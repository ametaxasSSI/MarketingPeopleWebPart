<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meet the Marketing Team</title>
<style>
  /* ---- Look and feel (matches SharePoint's People web part) ---- */
  :root {
    --text: #323130;          /* SharePoint primary text */
    --subtext: #605e5c;       /* SharePoint secondary text */
    --link: #0078d4;          /* SharePoint theme blue - change to your site's theme color */
    --hover-bg: #f3f2f1;
    --photo-size: 72px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    font-family: "Segoe UI", "Segoe UI Web (West European)", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", sans-serif;
    color: var(--text);
    background: #ffffff;
  }
  h2 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 16px;
  }
  .people {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 8px 24px;
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .person {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 8px;
    border-radius: 2px;
  }
  .person:hover { background: var(--hover-bg); }

  .photo, .initials {
    width: var(--photo-size);
    height: var(--photo-size);
    border-radius: 50%;
    flex-shrink: 0;
  }
  .photo { object-fit: cover; }
  .initials {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    font-weight: 600;
    color: #fff;
  }

  .details { min-width: 0; }
  .name {
    font-size: 16px;
    font-weight: 600;
    margin: 0;
  }
  .title {
    font-size: 14px;
    color: var(--subtext);
    margin: 2px 0 4px;
  }
  .email {
    font-size: 14px;
    color: var(--link);
    text-decoration: none;
    word-break: break-all;
  }
  .email:hover, .email:focus { text-decoration: underline; }
  .email:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
</style>
</head>
<body>

<h2>Meet the Marketing Team</h2>
<ul class="people" id="people"></ul>

<script>
  /* =================================================================
     EDIT THIS LIST
     photo = full URL to the headshot in your SharePoint folder.
     To get it: open the image in SharePoint > ... > Copy link is NOT
     the right one. Instead open the image, then copy the address that
     ends in the file name, e.g.
     https://yourtenant.sharepoint.com/sites/YourSite/Headshots/jane-doe.jpg
     Leave photo as "" to show initials instead.
     ================================================================= */
  const people = [
    {
      name:  "Madison O'Donohoe",
      title: "CRM & Marketing Manager",
      email: "madison.odonohoe@sportsfield.com",
      photo: "https://sportsspecialties.sharepoint.com/Employee%20Pics/odonohoe_madison.jpg"
    },
    {
      name:  "Chloe Goodlander",
      title: "Marketing Coordinator",
      email: "chloe.goodlander@sportsfield.com",
      photo: "https://sportsspecialties.sharepoint.com/Employee%20Pics/goodlander_chloe.jpg"
    },
    {
      name:  "Jason Whitney",
      title: "Digital Marketing Specialist",
      email: "jason.whitney@sportsfield.com",
      photo: "https://sportsspecialties.sharepoint.com/Employee%20Pics/whitney_jason.jpg"
    }
  ];


  const colors = ["#0078d4", "#8764b8", "#038387", "#ca5010", "#498205", "#c239b3", "#986f0b", "#004e8c"];

  function initialsFor(name) {
    const parts = name.trim().split(/\s+/);
    return (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : "")).toUpperCase();
  }
  function colorFor(name) {
    let h = 0;
    for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    return colors[h % colors.length];
  }
  function initialsCircle(name) {
    const div = document.createElement("div");
    div.className = "initials";
    div.style.background = colorFor(name);
    div.textContent = initialsFor(name);
    div.setAttribute("aria-hidden", "true");
    return div;
  }

  const list = document.getElementById("people");
  people.forEach(p => {
    const li = document.createElement("li");
    li.className = "person";

    if (p.photo) {
      const img = document.createElement("img");
      img.className = "photo";
      img.src = p.photo;
      img.alt = p.name;
      img.loading = "lazy";
      // If the photo can't load, fall back to initials like SharePoint does
      img.onerror = () => img.replaceWith(initialsCircle(p.name));
      li.appendChild(img);
    } else {
      li.appendChild(initialsCircle(p.name));
    }

    const details = document.createElement("div");
    details.className = "details";
    details.innerHTML = `
      <p class="name"></p>
      <p class="title"></p>
      <a class="email" target="_top"></a>`;
    details.querySelector(".name").textContent = p.name;
    details.querySelector(".title").textContent = p.title;
    const a = details.querySelector(".email");
    a.href = "mailto:" + p.email;
    a.textContent = p.email;

    li.appendChild(details);
    list.appendChild(li);
  });
</script>
</body>
</html>
